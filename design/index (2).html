<style>
  html, body, #root { margin:0; padding:0; min-height:100vh; }
  body { font-family: 'Space Grotesk', system-ui, sans-serif; background:#FAFAF7; color:#1A1815; -webkit-font-smoothing: antialiased; }
  .tnum { font-variant-numeric: tabular-nums lining-nums; }
  .underline-forest { text-decoration: underline; text-decoration-color: #1E4D2B; text-decoration-thickness: 2px; text-underline-offset: 4px; }
  @keyframes pulseDot { 0%,100%{opacity:.4} 50%{opacity:1} }
  .pulse-dot { animation: pulseDot 1.8s ease-in-out infinite; }
  @keyframes shimmer { 0%{background-position: -200% 0} 100%{background-position: 200% 0} }
  .shimmer { background: linear-gradient(90deg, #EBE4D2 0%, #F4EFE3 50%, #EBE4D2 100%); background-size: 200% 100%; animation: shimmer 1.6s linear infinite; }

  /* ─── motion system ─── */
  @keyframes fadeUp { 0% { opacity: 0; transform: translateY(18px); } 100% { opacity: 1; transform: none; } }
  @keyframes slideInRight { 0% { opacity: 0; transform: translateX(24px); } 100% { opacity: 1; transform: none; } }
  @keyframes scaleIn { 0% { opacity: 0; transform: scale(0.96); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes pop { 0% { opacity: 0; transform: scale(0.4); } 70% { transform: scale(1.05); } 100% { opacity: 1; transform: scale(1); } }
  @keyframes flicker { 0%, 90%, 100% { opacity: 1; } 92%, 96% { opacity: 0.55; } 94% { opacity: 1; } }
  @keyframes avatarStroke { 0% { stroke-dashoffset: 239; } 100% { stroke-dashoffset: 0; } }
  @keyframes wipPulse { 0%, 100% { box-shadow: 0 0 0 0 rgba(30, 77, 43, 0.45); } 50% { box-shadow: 0 0 0 6px rgba(30, 77, 43, 0); } }
  .wip-pulse { animation: wipPulse 2s ease-in-out infinite; }

  /* surname draws an underline on hover */
  .surname-hover em { position: relative; display: inline-block; }
  .surname-hover em::after {
    content: ""; position: absolute; left: 0; right: 0; bottom: 0.06em; height: 5px;
    background: #1E4D2B; transform: scaleX(0); transform-origin: left center;
    transition: transform 600ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .surname-hover:hover em::after { transform: scaleX(1); }

  /* button arrow shifts right on hover */
  .btn-icon-shift svg { transition: transform 240ms cubic-bezier(0.2, 0.8, 0.2, 1); }
  .btn-icon-shift:hover svg { transform: translateX(3px); }
  .fade-up        { opacity: 0; animation: fadeUp 700ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
  .slide-in-right { opacity: 0; animation: slideInRight 800ms cubic-bezier(0.2, 0.8, 0.2, 1) forwards; }
  .scale-in       { animation: scaleIn 240ms cubic-bezier(0.16, 1, 0.3, 1); }
  .contrib-pop    { opacity: 0; animation: pop 380ms cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
  .flicker        { animation: flicker 5.4s ease-in-out infinite; }
  .d-0  { animation-delay: 0ms;   }
  .d-1  { animation-delay: 80ms;  }
  .d-2  { animation-delay: 160ms; }
  .d-3  { animation-delay: 240ms; }
  .d-4  { animation-delay: 320ms; }
  .d-5  { animation-delay: 400ms; }
  .d-6  { animation-delay: 480ms; }

  /* card hover affordance */
  .repo-card .arrow-affordance {
    opacity: 0; transform: translateX(-6px);
    transition: opacity 200ms ease, transform 200ms cubic-bezier(0.2, 0.8, 0.2, 1);
  }
  .repo-card:hover .arrow-affordance { opacity: 1; transform: translateX(0); }

  /* smooth theme + page transitions */
  body, [data-theme] { transition: background-color 320ms ease; }

  @media (prefers-reduced-motion: reduce) {
    .fade-up, .slide-in-right, .scale-in, .contrib-pop, .flicker { animation: none !important; opacity: 1 !important; transform: none !important; }
    body, [data-theme] { transition: none; }
  }

  :focus-visible { outline: 2px solid var(--accent, #1E4D2B); outline-offset: 2px; }

  /* ─── THEME: SANS (default) ─── modern, polished, Space Grotesk ─── */
  [data-theme="sans"] { --accent:#1E4D2B; }
  [data-theme="sans"] body, [data-theme="sans"] .font-serif { font-family: 'Space Grotesk', system-ui, sans-serif; letter-spacing: -0.01em; }
  [data-theme="sans"] .font-mono { font-family: 'JetBrains Mono', ui-monospace, monospace; }
  [data-theme="sans"] .italic { font-style: normal; font-weight: 600; color: #1E4D2B; }
  [data-theme="sans"] .bg-paper    { background-color: #FAFAF7 !important; }
  [data-theme="sans"] .bg-paper-2  { background-color: #FFFFFF !important; }
  [data-theme="sans"] .bg-paper-3  { background-color: #F0F0EC !important; }
  [data-theme="sans"] .bg-paper-3\/30 { background-color: rgba(240,240,236,0.5) !important; }
  [data-theme="sans"] .bg-paper-3\/40 { background-color: rgba(240,240,236,0.7) !important; }
  [data-theme="sans"] .border-rule { border-color: #E5E5E0 !important; }
  [data-theme="sans"] .divide-rule > :not([hidden]) ~ :not([hidden]) { border-color: #E5E5E0 !important; }
  [data-theme="sans"] .bg-paper\/85 { background-color: rgba(250,250,247,0.85) !important; }

  /* ─── THEME: MONO ─── brutalist developer, JetBrains Mono throughout ─── */
  [data-theme="mono"] { --accent:#1E4D2B; }
  [data-theme="mono"] body, [data-theme="mono"] .font-serif, [data-theme="mono"] .font-mono {
    font-family: 'JetBrains Mono', ui-monospace, monospace;
  }
  [data-theme="mono"] .font-serif { letter-spacing: -0.04em; font-weight: 500; }
  [data-theme="mono"] .italic { font-style: normal; color: #1E4D2B; text-decoration: underline; text-decoration-color: #1E4D2B; text-decoration-thickness: 2px; text-underline-offset: 4px; }
  [data-theme="mono"] .bg-paper    { background-color: #F4EFE3 !important; }
  [data-theme="mono"] .bg-paper-2  { background-color: #FBF7EC !important; }
  [data-theme="mono"] .bg-paper-3  { background-color: #EBE4D2 !important; }

  /* ─── THEME: SERIF ─── editorial classic, Newsreader + IBM Plex Mono ─── */
  [data-theme="serif"] { --accent:#1E4D2B; }
  [data-theme="serif"] body, [data-theme="serif"] .font-serif { font-family: 'Newsreader', ui-serif, Georgia, serif; }
  [data-theme="serif"] .font-mono { font-family: 'IBM Plex Mono', ui-monospace, monospace; }
  [data-theme="serif"] .italic { font-style: italic; color: #1E4D2B; }
  [data-theme="serif"] .bg-paper    { background-color: #F4EFE3 !important; }
  [data-theme="serif"] .bg-paper-2  { background-color: #FBF7EC !important; }
  [data-theme="serif"] .bg-paper-3  { background-color: #EBE4D2 !important; }
</style>
</head>

</body>
</html>
